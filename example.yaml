apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-admin
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-admin-cluster-admin-binding
subjects:
- kind: ServiceAccount
  name: sandbox-admin
  namespace: sandbox
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: managed.openshift.io/v1alpha1
kind: MustGather
metadata:
  name: example
  namespace: sandbox
spec:
  caseID: '02527285'
  caseManagementAccountSecretRef:
    name: case-management-creds
  serviceAccountRef:
    name: sandbox-admin